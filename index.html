<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Менің күнделігім</title>
<style>
:root{--bg:#f7f1e6;--card:#fffaf0;--tx:#3a2e26;--mu:#7a6b5e;--ac:#b5543a;--ac2:#e9d3b8;--bd:#e4d6c0;--ok:#4d7a58;color-scheme:light;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1a17;--card:#2a231f;--tx:#f0e6da;--mu:#b3a393;--ac:#e08a6b;--ac2:#3b2f28;--bd:#41362e;--ok:#8fc29a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1a17;--card:#2a231f;--tx:#f0e6da;--mu:#b3a393;--ac:#e08a6b;--ac2:#3b2f28;--bd:#41362e;--ok:#8fc29a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:17px/1.6 Inter,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3,.ti{font-family:Lora,Georgia,serif}h1{font-size:1.6rem;margin:.2em 0}h2{margin:.3em 0}
main{max-width:720px;margin:0 auto;padding:14px 14px 110px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000d;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{min-height:44px;min-width:44px;padding:6px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[contenteditable]:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}.on{background:var(--ac2);border-color:var(--ac)}
input,select,textarea{min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.row>*{flex:0 1 auto}.row .g{flex:1 1 140px}
.mu{color:var(--mu);font-size:.9rem}.bad{color:#c0392b}.ti{font-size:1.4rem;font-weight:700;border:0;background:transparent;border-bottom:2px solid var(--bd);border-radius:0}
.ed{min-height:200px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);margin:8px 0}.ed:empty:before{content:attr(data-ph);color:var(--mu)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:.75rem;flex:1}nav button span{font-size:1.4rem}nav .on{color:var(--ac);background:none;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}.grid .ph{position:relative}.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--ac2);cursor:zoom-in}
.ph button{position:absolute;top:2px;right:2px;min-height:30px;min-width:30px;padding:0}
.t{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--bd)}.t .x{flex:1}.t.d .x{text-decoration:line-through;color:var(--mu)}
.ck{border-radius:50%;width:44px;height:44px;font-size:1.2rem;color:transparent}.d .ck{background:var(--ok);color:#fff;border-color:var(--ok);animation:pop .35s}@keyframes pop{50%{transform:scale(1.2)}}
.p0{border-left:4px solid var(--ok);padding-left:8px}.p1{border-left:4px solid #d9a441;padding-left:8px}.p2{border-left:4px solid #c0392b;padding-left:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal button{min-height:44px;padding:0;position:relative;border-radius:12px}.cal i{position:absolute;bottom:4px;left:50%;width:5px;height:5px;margin-left:-2px;border-radius:50%;background:var(--ac)}
.lb{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:9}.lb img{max-width:96%;max-height:92%;border-radius:8px}
.toast{display:none;position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:#c0392b;color:#fff;padding:12px 14px;border-radius:12px;z-index:20;box-shadow:0 4px 14px #0004}
.warn{background:var(--ac2);border-radius:12px;padding:10px 14px;font-size:.9rem}
@media print{nav,.top button,.row button,.warn{display:none}body{background:#fff;color:#000}}
</style>
</head>
<body>
<main id="m"></main>
<nav id="nv"></nav>
<script>
/* ===== ДЕРЕКТЕР ===== entries:{id,date,title,text,mood,weather,tags[],photos[]} · tasks:{id,date,time,title,pri,cat,done} */
const KUN=["жексенбі","дүйсенбі","сейсенбі","сәрсенбі","бейсенбі","жұма","сенбі"],AY=["қаңтар","ақпан","наурыз","сәуір","мамыр","маусым","шілде","тамыз","қыркүйек","қазан","қараша","желтоқсан"];
const MOOD=["😄","🙂","😐","😔","😢"],WEA=["☀️","⛅","☁️","🌧️","❄️"],CAT=["жұмыс","оқу","үй","денсаулық","жеке"],PRI=["төмен","орта","жоғары"];
const QUOTES=["Кішкентай қадам да – қадам.","Бүгінгі күн – жаңа бет.","Тыныс ал, қазір жеткілікті.","Бәрін бірден емес, бірін-бірін.","Өзіңе мейірімді бол."];
const PROMPTS=["Бүгін не үшін алғыс айтасың?","Ең жақсы сәт қандай болды?","Бүгін нені үйрендің?","Ертең не күтіп тұр?","Қандай адам есіңде қалды?"];
/* ===== STORAGE ===== */
let S={entries:[],tasks:[],theme:"",seeded:false};
try{const r=localStorage.getItem("dg");if(r)Object.assign(S,JSON.parse(r))}catch(e){}
function toast(m,ok){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";t.setAttribute("role","alert");document.body.appendChild(t)}t.textContent=m;t.style.background=ok?"#3d6b48":"#c0392b";t.style.display="block";clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display="none",6000)}
const save=()=>{try{localStorage.setItem("dg",JSON.stringify(S));return true}catch(e){toast("⚠️ Сақталмады! Жад толы немесе қолжетімсіз. Көшірме жасап қой.");return false}};
let db;const idb=()=>db||(db=new Promise((res,rej)=>{try{const r=indexedDB.open("dg",1);r.onupgradeneeded=()=>r.result.createObjectStore("p");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
const tx=async(m,f)=>{const d=await idb();return new Promise((res,rej)=>{const q=f(d.transaction("p",m).objectStore("p"));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const putP=(i,v)=>tx("readwrite",s=>s.put(v,i)),getP=i=>tx("readonly",s=>s.get(i)),delP=i=>tx("readwrite",s=>s.delete(i));
const compress=f=>new Promise((res,rej)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.8))};i.onerror=rej;i.src=u});
async function hydrate(r){for(const im of r.querySelectorAll("img[data-p]")){try{const v=await getP(im.dataset.p);if(v)im.src=v}catch(e){}}}
/* ===== КӨМЕКШІЛЕР ===== */
const p2=n=>String(n).padStart(2,"0"),iso=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()),pd=s=>new Date(s+"T12:00"),today=()=>iso(new Date());
const add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const fd=s=>{const d=pd(s);return d.getDate()+" "+AY[d.getMonth()]+", "+KUN[d.getDay()]};
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plain=h=>new DOMParser().parseFromString(String(h||"").replace(/<[^>]+>/g," "),"text/html").body.textContent;
const clean=h=>{const d=new DOMParser().parseFromString(String(h||""),"text/html");d.querySelectorAll("script,style,iframe,object,embed,link,meta,form").forEach(n=>n.remove());d.body.querySelectorAll("*").forEach(n=>{[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||/^\s*javascript:/i.test(a.value))n.removeAttribute(a.name)})});return d.body.innerHTML};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
if(!S.seeded){const t=today();S.entries=[{id:uid(),date:t,title:"Бірінші жазба",text:"<p>Бұл – менің жеке кеңістігім. Бүгін өзіме уақыт бөлдім.</p>",mood:1,weather:0,tags:["жеке"],photos:[]},{id:uid(),date:add(t,-1),title:"Тыныш кеш",text:"<p>Кешке серуендеп, шай іштім.</p>",mood:0,weather:1,tags:["отбасы"],photos:[]}];
S.tasks=[{id:uid(),date:t,time:"09:00",title:"Таңертеңгі жаттығу",pri:1,cat:3,done:false},{id:uid(),date:t,time:"14:00",title:"Кітап оқу – 20 бет",pri:0,cat:4,done:false},{id:uid(),date:t,time:"18:30",title:"Үйге азық-түлік алу",pri:2,cat:2,done:false}];S.seeded=true;save()}
if(S.theme)document.documentElement.dataset.theme=S.theme;
/* ===== ЖАЙ-КҮЙ ===== */
const M=document.getElementById("m");let view="today",cur=null,sel=today(),fq="",fm=-1;
const go=v=>{view=v;render();scrollTo(0,0)};
function nav(){const t=[["today","🏠","Бүгін"],["diary","📖","Күнделік"],["plan","🗓️","Жоспар"]];document.getElementById("nv").innerHTML=t.map(x=>`<button data-a="go" data-v="${x[0]}" class="${view===x[0]||(view==="edit"&&x[0]==="diary")?"on":""}"><span>${x[1]}</span>${x[2]}</button>`).join("");}
function render(){if(M._flush&&document.getElementById("tx")){M._flush();if(view!=="edit")dropEmpty()}if(view!=="edit")M._flush=null;nav();({today:vToday,diary:vDiary,plan:vPlan,edit:vEdit})[view]();hydrate(M)}
const taskRow=t=>`<div class="t p${t.pri} ${t.done?"d":""}"><button class="ck" data-a="tog" data-id="${t.id}" aria-label="Орындалды">✓</button><div class="x"><b>${esc(t.title)}</b><div class="mu">${t.time||"—"} · ${CAT[t.cat]}</div></div>${t.done?"":`<button data-a="mv" data-id="${t.id}" title="Ертеңге көшіру">→</button>`}<button data-a="dt" data-id="${t.id}" class="bad" aria-label="Жою">✕</button></div>`;
/* ----- БҮГІН ----- */
function vToday(){const n=new Date(),h=n.getHours(),g=h<5?"Қайырлы түн":h<12?"Қайырлы таң":h<18?"Қайырлы күн":"Қайырлы кеш",t=today(),ts=S.tasks.filter(x=>x.date===t).sort((a,b)=>(a.time||"").localeCompare(b.time||"")),e=S.entries.find(x=>x.date===t);
M.innerHTML=`<div class="top"><div><h1>${g} 🌿</h1><div class="mu">${fd(t)}, ${p2(h)}:${p2(n.getMinutes())}</div></div><button data-a="th" aria-label="Тақырып">🌓</button></div>
<div class="card"><i>«${QUOTES[n.getDate()%QUOTES.length]}»</i></div>
<div class="card"><h3>Көңіл-күйің қандай?</h3><div class="row">${MOOD.map((m,i)=>`<button data-a="qm" data-v="${i}" class="${e&&e.mood===i?"on":""}" style="font-size:1.5rem">${m}</button>`).join("")}</div>
<h3>Бүгін не болды?</h3><textarea id="qn" rows="3" placeholder="Бір-екі сөйлем жазып көр…"></textarea><div class="row"><button class="pri" data-a="qs">Жазбаға қосу</button><span class="mu" id="qk"></span></div></div>
<div class="card"><h3>Бүгінгі тапсырмалар</h3>${ts.length?ts.map(taskRow).join(""):`<p class="mu">Бүгін тапсырма жоқ. Тыныш күн болсын 🌤️</p>`}<button data-a="go" data-v="plan">Жоспарға өту</button></div>
<div class="card"><h3>💾 Резервтік көшірме</h3><p class="mu">Деректер осы қолданбада сақталады. Жазбаларды уақыт өте келе файлға сақтап тұр.</p><div class="row"><button class="pri" data-a="ex">Көшірме жасау</button><button data-a="im">Қалпына келтіру</button><input type="file" id="imf" accept=".json,application/json" hidden></div><div class="mu">${S.lastBackup?"Соңғы көшірме: "+fd(S.lastBackup):"Көшірме әлі жасалмаған"}</div></div>`}
function todayEntry(){let e=S.entries.find(x=>x.date===today());if(!e){e={id:uid(),date:today(),title:"Бүгін",text:"",mood:2,weather:0,tags:[],photos:[]};S.entries.push(e)}return e}
/* ----- КҮНДЕЛІК ----- */
function vDiary(){let l=[...S.entries].sort((a,b)=>b.date.localeCompare(a.date)||0);const q=fq.toLowerCase();
l=l.filter(e=>(fm<0||e.mood===fm)&&(!q||(e.title+" "+plain(e.text)+" "+e.tags.join(" ")+" "+e.date+" "+fd(e.date)).toLowerCase().includes(q)));
M.innerHTML=`<div class="top"><h1>Күнделік</h1><button class="pri" data-a="ne">＋ Жаңа</button></div><input id="sq" placeholder="🔍 Мәтін, тег немесе күн бойынша іздеу" value="${esc(fq)}">
<div class="row">${MOOD.map((m,i)=>`<button data-a="fm" data-v="${i}" class="${fm===i?"on":""}">${m}</button>`).join("")}</div>
${l.length?l.map(e=>`<div class="card" data-a="oe" data-id="${e.id}" tabindex="0" role="button" style="cursor:pointer"><div class="mu">${fd(e.date)} · ${MOOD[e.mood]} ${WEA[e.weather]}</div><h3>${esc(e.title)||"Атаусыз"}</h3><div>${esc(plain(e.text).slice(0,140))}</div><div class="mu">${e.tags.map(t=>"#"+esc(t)).join(" ")} ${e.photos.length?"📷"+e.photos.length:""}</div></div>`).join(""):`<div class="card"><p>Әлі жазба жоқ. Бүгінгі күнің туралы бір сөйлем жазып көр.</p></div>`}`;
document.getElementById("sq").oninput=e=>{fq=e.target.value;const p=e.target.selectionStart;vDiary();const s=document.getElementById("sq");s.focus();s.setSelectionRange(p,p)}}
function vEdit(){const e=S.entries.find(x=>x.id===cur);if(!e)return go("diary");
M.innerHTML=`<div class="top"><button data-a="bk">← Артқа</button><span class="mu" id="sv"></span><span><button data-a="pr" aria-label="Басып шығару">🖨️</button><button data-a="de" class="bad" aria-label="Жою">🗑</button></span></div>
<div class="card"><input class="ti" id="t" placeholder="Тақырып" value="${esc(e.title)}"><div class="row"><input type="date" id="d" class="g" value="${e.date}"><select id="w" class="g" aria-label="Ауа райы">${WEA.map((w,i)=>`<option value="${i}" ${e.weather===i?"selected":""}>${w}</option>`).join("")}</select></div>
<div class="row">${MOOD.map((m,i)=>`<button data-a="em" data-v="${i}" class="${e.mood===i?"on":""}" style="font-size:1.4rem">${m}</button>`).join("")}</div>
<input id="tg" placeholder="Тегтер: отбасы, жұмыс, саяхат" value="${esc(e.tags.join(", "))}">
<div class="row"><button data-c="bold"><b>Қ</b></button><button data-c="italic"><i>К</i></button><button data-c="insertUnorderedList">• Тізім</button><button data-a="ps">💡 Сұрақ</button></div>
<div id="tx" class="ed" contenteditable="true" data-ph="Бүгін не болды?…">${e.text}</div>
<div class="grid">${e.photos.map(p=>`<div class="ph"><img data-p="${p}" alt="Сурет" data-a="lb"><button data-a="rp" data-p="${p}" aria-label="Суретті жою">✕</button></div>`).join("")}</div>
<div class="row"><label class="g"><span class="pri" style="display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:14px;cursor:pointer">📷 Сурет қосу</span><input type="file" id="fi" accept="image/*" multiple hidden></label></div></div>`;
let tm;const gv=i=>document.getElementById(i);
const collect=()=>{if(!gv("tx"))return;e.title=gv("t").value;e.date=gv("d").value||e.date;e.weather=+gv("w").value;e.tags=gv("tg").value.split(",").map(s=>s.trim().replace(/^#/,"")).filter(Boolean);e.text=gv("tx").innerHTML;const ok=save(),sp=gv("sv");if(sp)sp.textContent=ok?"Сақталды ✓":"⚠️ Сақталмады"};
const sv=()=>{clearTimeout(tm);tm=setTimeout(collect,350)};
M._flush=()=>{clearTimeout(tm);collect()};
["t","d","w","tg","tx"].forEach(i=>{const el=gv(i);el.addEventListener("input",sv);el.addEventListener("change",sv)});M._sv=sv;
gv("tx").addEventListener("paste",ev=>{ev.preventDefault();document.execCommand("insertText",false,(ev.clipboardData||window.clipboardData).getData("text/plain"));sv()});
document.getElementById("fi").onchange=async ev=>{for(const f of ev.target.files){try{const id=uid();await putP(id,await compress(f));e.photos.push(id)}catch(x){}}save();render()}}
/* ----- ЖОСПАР ----- */
function vPlan(){const d=pd(sel),y=d.getFullYear(),mo=d.getMonth(),first=(new Date(y,mo,1).getDay()+6)%7,days=new Date(y,mo+1,0).getDate(),ts=S.tasks.filter(x=>x.date===sel).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
let c="";for(let i=0;i<first;i++)c+="<span></span>";for(let i=1;i<=days;i++){const s=y+"-"+p2(mo+1)+"-"+p2(i),has=S.tasks.some(t=>t.date===s)||S.entries.some(t=>t.date===s);c+=`<button data-a="sd" data-d="${s}" class="${s===sel?"on":""}" ${s===today()?'style="font-weight:700;color:var(--ac)"':""}>${i}${has?"<i></i>":""}</button>`}
const en=S.entries.filter(x=>x.date===sel);
M.innerHTML=`<h1>Жоспар</h1><div class="card"><div class="top"><button data-a="pm" aria-label="Алдыңғы ай">‹</button><b>${AY[mo]} ${y}</b><button data-a="nm" aria-label="Келесі ай">›</button></div><div class="cal mu">${["дс","сс","ср","бс","жм","сб","жс"].map(x=>`<span>${x}</span>`).join("")}</div><div class="cal">${c}</div></div>
<div class="card"><h3>${fd(sel)}</h3>${ts.length?ts.map(taskRow).join(""):`<p class="mu">Бұл күнге тапсырма жоқ.</p>`}
${en.map(e=>`<p class="mu" data-a="oe" data-id="${e.id}" style="cursor:pointer">📖 ${esc(e.title)} →</p>`).join("")}
<div class="row"><input id="nt" class="g" placeholder="Жаңа тапсырма"><input id="ntm" type="time" style="width:120px"></div><div class="row"><select id="np" class="g">${PRI.map((p,i)=>`<option value="${i}" ${i===1?"selected":""}>${p}</option>`).join("")}</select><select id="nc" class="g">${CAT.map((p,i)=>`<option value="${i}">${p}</option>`).join("")}</select><button class="pri" data-a="at">Қосу</button></div></div>`}
/* ===== РЕЗЕРВТІК КӨШІРМЕ ===== */
async function exportData(){try{const ph={};for(const e of S.entries)for(const p of e.photos){try{const v=await getP(p);if(v)ph[p]=v}catch(x){}}
const blob=new Blob([JSON.stringify({app:"kundelik",v:1,saved:new Date().toISOString(),data:S,photos:ph})],{type:"application/json"});
const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="kundelik-"+today()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
S.lastBackup=today();save();render()}catch(x){toast("⚠️ Көшірме жасалмады")}}
async function importData(f,inp){if(!f)return;try{const j=JSON.parse(await f.text()),d=j&&j.data;if(!d||!Array.isArray(d.entries)||!Array.isArray(d.tasks))throw 0;
const rg=(v,n,df)=>Number.isInteger(+v)&&+v>=0&&+v<n?+v:df,dt=v=>/^\d{4}-\d\d-\d\d$/.test(v)?v:today();
const en=d.entries.map(x=>({id:String(x.id||uid()),date:dt(x.date),title:String(x.title||""),text:clean(x.text),mood:rg(x.mood,5,2),weather:rg(x.weather,5,0),tags:Array.isArray(x.tags)?x.tags.map(String):[],photos:Array.isArray(x.photos)?x.photos.map(String):[]}));
const tk=d.tasks.map(x=>({id:String(x.id||uid()),date:dt(x.date),time:String(x.time||""),title:String(x.title||""),pri:rg(x.pri,3,1),cat:rg(x.cat,5,4),done:!!x.done}));
if(!confirm("Қазіргі барлық жазба осы файлдағымен ауыстырылады. Жалғастыру керек пе?")){inp.value="";return}
const ph=j.photos||{};for(const id in ph)if(typeof ph[id]==="string"&&ph[id].startsWith("data:image/"))await putP(id,ph[id]);
S={entries:en,tasks:tk,theme:d.theme==="dark"||d.theme==="light"?d.theme:"",seeded:true,lastBackup:/^\d{4}-\d\d-\d\d$/.test(d.lastBackup)?d.lastBackup:""};
if(S.theme)document.documentElement.dataset.theme=S.theme;else delete document.documentElement.dataset.theme;
if(save()){toast("Қалпына келтірілді ✓",true)}render()}catch(x){toast("⚠️ Файл дұрыс емес немесе бүлінген")}inp.value=""}
document.addEventListener("change",ev=>{if(ev.target.id==="imf")importData(ev.target.files[0],ev.target)});
/* ===== ОҚИҒАЛАР ===== */
function dropEmpty(){const e=S.entries.find(x=>x.id===cur);if(e&&!e.title.trim()&&!plain(e.text).trim()&&!e.photos.length){S.entries=S.entries.filter(x=>x!==e);save()}}
document.addEventListener("mousedown",e=>{const b=e.target.closest("[data-c]");if(b){e.preventDefault();document.execCommand(b.dataset.c);M._sv&&M._sv()}});
document.addEventListener("click",async ev=>{const b=ev.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id,v=b.dataset.v,tk=S.tasks.find(x=>x.id===id);
if(a==="go")go(v);else if(a==="th"){const r=document.documentElement,dk=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);S.theme=dk?"light":"dark";r.dataset.theme=S.theme;save()}
else if(a==="tog"){tk.done=!tk.done;save();render()}else if(a==="mv"){tk.date=add(tk.date,1);save();render()}else if(a==="dt"){S.tasks=S.tasks.filter(x=>x!==tk);save();render()}
else if(a==="qm"){const e=todayEntry();e.mood=+v;save();render()}else if(a==="qs"){const t=document.getElementById("qn").value.trim();if(!t)return;const e=todayEntry();e.text+="<p>"+esc(t)+"</p>";save();document.getElementById("qn").value="";document.getElementById("qk").textContent="Жазылды ✓"}
else if(a==="ne"){const e={id:uid(),date:today(),title:"",text:"",mood:2,weather:0,tags:[],photos:[]};S.entries.push(e);cur=e.id;go("edit")}
else if(a==="oe"){cur=id;go("edit")}else if(a==="bk"){go("diary")}else if(a==="fm"){fm=fm===+v?-1:+v;render()}
else if(a==="em"){const e=S.entries.find(x=>x.id===cur);e.mood=+v;save();render()}
else if(a==="de"){if(confirm("Жазбаны жою керек пе?")){const e=S.entries.find(x=>x.id===cur);for(const p of e.photos)try{await delP(p)}catch(x){}S.entries=S.entries.filter(x=>x!==e);save();go("diary")}}
else if(a==="rp"){const e=S.entries.find(x=>x.id===cur);e.photos=e.photos.filter(x=>x!==b.dataset.p);try{await delP(b.dataset.p)}catch(x){}save();render()}
else if(a==="ps"){const t=document.getElementById("tx");t.innerHTML="<p><b>"+PROMPTS[Math.floor(Math.random()*PROMPTS.length)]+"</b></p>"+t.innerHTML;M._sv()}
else if(a==="pr")print();else if(a==="lb"){const l=document.createElement("div");l.className="lb";l.innerHTML=`<img src="${b.src}" alt="">`;l.onclick=()=>l.remove();document.body.appendChild(l)}
else if(a==="sd"){sel=b.dataset.d;render()}else if(a==="pm"||a==="nm"){const d=pd(sel);d.setDate(1);d.setMonth(d.getMonth()+(a==="nm"?1:-1));sel=iso(d);render()}
else if(a==="ex")exportData();else if(a==="im")document.getElementById("imf").click();
else if(a==="at"){const t=document.getElementById("nt").value.trim();if(!t)return;S.tasks.push({id:uid(),date:sel,time:document.getElementById("ntm").value,title:t,pri:+document.getElementById("np").value,cat:+document.getElementById("nc").value,done:false});save();render()}});
document.addEventListener("keydown",e=>{if((e.key==="Enter")&&e.target.dataset&&e.target.dataset.a==="oe")e.target.click();if(e.key==="Enter"&&e.target.id==="nt")document.querySelector('[data-a="at"]').click()});
render();
</script>
</body>
</html>
